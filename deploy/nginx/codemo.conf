# Host Nginx site config for a Hostinger VPS (Ubuntu).
# Works for both the PM2 path and the Docker path (app published on 127.0.0.1:3000).
#
#   sudo cp deploy/nginx/codemo.conf /etc/nginx/sites-available/codemo
#   sudo sed -i 's/example.com/YOUR-DOMAIN/g' /etc/nginx/sites-available/codemo
#   sudo ln -s /etc/nginx/sites-available/codemo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com   # adds the 443 server + redirect

upstream codemo_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

    # Uploaded media (STORAGE_DRIVER=local).
    # PM2 path: the project's uploads/ folder. Docker path: either keep this
    # commented out (the app serves /uploads itself) or bind-mount the volume.
    location /uploads/ {
        alias /var/www/codemo/uploads/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri @app;
    }

    location /_next/static/ {
        proxy_pass http://codemo_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /images/ {
        proxy_pass http://codemo_app;
        expires 30d;
        access_log off;
    }

    location @app {
        proxy_pass http://codemo_app;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://codemo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
