# Nginx config for the optional `nginx` service in docker-compose.yml (profile "proxy").
# Terminate TLS in front of this (Cloudflare, Hostinger proxy) or adapt deploy/nginx/codemo.conf.

upstream codemo_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

    # Uploaded media straight from the shared volume
    location /uploads/ {
        alias /srv/uploads/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Hashed build assets — cache forever
    location /_next/static/ {
        proxy_pass http://codemo_app;
        proxy_cache_valid 200 1y;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /images/ {
        proxy_pass http://codemo_app;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://codemo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
